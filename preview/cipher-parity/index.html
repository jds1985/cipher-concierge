<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cipher parity preview</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font: 18px/1.45 system-ui, sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 28px; }
    .banner { background: #ffd000; color: #000; font-weight: 800; padding: 12px; }
    .diag, .turn, button, textarea { border: 3px solid #fff; }
    .diag, .turn { padding: 12px; margin: 12px 0; }
    button { background: #fff; color: #000; font: 700 16px/1.3 system-ui; min-height: 48px; margin: 4px; padding: 8px 10px; cursor: pointer; }
    button:disabled { opacity: 0.45; }
    textarea { width: 100%; min-height: 64px; background: #000; color: #fff; font: 18px system-ui; }
    pre { white-space: pre-wrap; background: #111; padding: 8px; }
    .badge { font-weight: 800; color: #ffd000; }
    a { color: #fff; }
  </style>
</head>
<body>
  <main>
    <p class="banner">Isolated parity preview. Not the live guest page. Not the old scratch harness.</p>
    <h1 id="hotel">Loading hotel…</h1>
    <section class="diag" id="diag" aria-live="polite"></section>
    <div id="chips"></div>
    <form id="f">
      <label for="q">Question</label>
      <textarea id="q"></textarea>
      <button type="submit" id="send">Ask</button>
      <button type="button" id="stop" hidden>Stop</button>
    </form>
    <section class="turn" id="turn"></section>
    <div id="log"></div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
